services:
  opensearch-node1: # This is also the hostname of the container within the Docker network (i.e. https://opensearch-node1/)
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    environment:
      - cluster.name=opensearch-cluster # Name the cluster
      - node.name=opensearch-node1 # Name the node that will run in this container
      - discovery.seed_hosts=opensearch-node1,opensearch-node2 # Nodes to look for when discovering the cluster
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2 # Nodes eligibile to serve as cluster manager
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g" # Set min and max JVM heap sizes to at least 50% of system RAM
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD} # Sets the demo admin user password when using demo configuration (for OpenSearch 2.12 and later)
      # Disable SSL
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - compatibility.override_main_response_version=true
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data # Creates volume called opensearch-data1 and mounts it to the container
    ports:
      # - 9200:9200 # REST API
      - 9600:9600 # Performance Analyzer
    restart: always

  opensearch-node2:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      # Disable SSL
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - compatibility.override_main_response_version=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    restart: always

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION}
    ports:
      - 5601:5601 # Map host port 5601 to container port 5601
    expose:
      - "5601" # Expose port 5601 for web access to OpenSearch Dashboards
    environment:
      # OPENSEARCH_HOSTS: '["https://opensearch-node1:9200","https://opensearch-node2:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
      # Unsecured
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200","http://opensearch-node2:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
      OPENSEARCH_SECURITY_ENABLED: false
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_SECURITY_COOKIE_SECURE: false
    volumes:
      - ./dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    restart: always
    depends_on:
      - opensearch-node1
      - opensearch-node2

  pygeoapi:
    image: docker.io/ndscprm/pygeoapi:0.24.0
    volumes:
      - ./pygeoapi/local.config.yml:/etc/pygeoapi/config.yml:ro
      - ./pygeoapi/uwsgi.conf:/var/lib/uwsgi/uwsgi.conf:ro
    environment:
      SCRIPT_NAME: /ogcapi
      PYGEOAPI_SERVER_URL: http://localhost/ogcapi
      PYGEOAPI_CONFIG: /etc/pygeoapi/config.yml
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  
  mapproxy:
    image: docker.io/ndscprm/mapproxy:7.0.0
    # ports:
    #   - "8080:8080"
    volumes:
      - ./mapproxy/data:/var/lib/mapproxy/config:ro
      - ./mapproxy/cache:/var/lib/mapproxy/cache
    restart: unless-stopped
    environment:
      MAPPROXY_CACHE_DIR: /var/lib/mapproxy/cache

  mapserver:
    image: docker.io/ndscprm/mapserver:8.6.6
    volumes:
      - ./mapserver:/var/lib/mapserver:ro
    environment:
      # Variável opcional para apontar o arquivo de configuração global do MapServer
      MAPSERVER_CONFIG_FILE: /var/lib/mapserver/mapserver.conf 
    restart: unless-stopped

  nginx:
    image: docker.io/nginxinc/nginx-unprivileged:1.31-trixie
    ports:
      - "80:8080"
      - "9200:9200"
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  opensearch-data1:
  opensearch-data2:
