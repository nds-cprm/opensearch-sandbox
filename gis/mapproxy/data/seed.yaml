# ---------------------------------------
# MapProxy example seeding configuration.
# ---------------------------------------
#
# This is a minimal MapProxy seeding configuration.
# See full_seed_example.yaml and the documentation for more options.
#

seeds:
  myseed1:
    caches: [litoestratigrafia]
    # grids: []
    coverages: [brasil]
    levels:
      to: 10
    refresh_before:
      days: 7

cleanups:
  myclean1:
    caches: [litoestratigrafia]
    remove_before:
      days: 14
    levels:
        from: 11

coverages:
  # mesmo EXTENT de gis/mapserver/default.map
  brasil:
    bbox: [-75, -35, -28, 6]
    srs: 'EPSG:4326'
