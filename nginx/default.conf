client_max_body_size 1G;

server {
    listen       8080;
    server_name  _;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # location /geoserver {
    #     proxy_pass http://geoserver:8080/geoserver;
        
    #     # Essential Proxy Headers
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host $host;
    #     proxy_set_header X-Forwarded-Port $server_port;

    #     # Mitigate internal GeoServer HTTP redirect loops
    #     # proxy_redirect http:// https://;
        
    #     # Buffer optimizations for large GIS capabilities payloads
    #     proxy_buffers 16 16k;
    #     proxy_buffer_size 32k;
    # }

    location /ogcapi {
        proxy_pass http://pygeoapi:80/ogcapi;
        
        # Essential Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Mitigate internal GeoServer HTTP redirect loops
        # proxy_redirect http:// https://;
        
        # Buffer optimizations for large GIS capabilities payloads
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    location /mapproxy {
        proxy_pass http://mapproxy:8080/mapproxy;
        
        # Essential Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Mitigate internal GeoServer HTTP redirect loops
        # proxy_redirect http:// https://;
        
        # Buffer optimizations for large GIS capabilities payloads
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # Define a rota para o serviço WMS/WFS
    # location ~* ^/geoserver/([a-zA-Z0-9_-]+) {
    #     # 1. Bloqueia se o usuário tentar injetar ?map= na URL por malícia
    #     if ($args ~* "(^|&)map=") {
    #         return 403;
    #     }

    #     # Captura o nome do mapa da URL (ex: "geologia")
    #     set $map_name $1;

    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_NAME /usr/lib/cgi-bin/mapserv;
    #     fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/mapserv;
        
    #     # 2. Monta dinamicamente o caminho do mapa baseado na URL
    #     # O MapServer vai procurar por /maps/geologia.map dentro do container dele
    #     fastcgi_param MS_MAPFILE /maps/$map_name.map;

    #     fastcgi_pass mapserver:9000;

    #     fastcgi_read_timeout 120s;
    #     fastcgi_send_timeout 120s;
    # }

    # rota de fallback
    location /mapserver {
        # Bloqueia qualquer tentativa de passar ?map= ou &map= na URL (case-insensitive)
        # if ($args ~* "(^|&)map=") {
        #     return 403;
        # }

        # Inclui os parâmetros padrão do FastCGI do Nginx
        include fastcgi_params;
        
        # Reescreve os parâmetros necessários para o MapServer
        fastcgi_param SCRIPT_NAME /usr/lib/cgi-bin/mapserv;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/mapserv;
        fastcgi_param MS_MAPFILE /maps/teste.map;

        # Aponta para o nome do serviço do container do MapServer e a porta 9000
        fastcgi_pass mapserver:9000;
    }
}

## OpenSearch
# Define the server pool
upstream opensearch-cluster {
    server opensearch-node1:9200;
    server opensearch-node2:9200;
}

server {
    listen       9200;
    server_name  _;

    # Desativa o buffer para respostas em tempo real (Streaming)
    proxy_buffering off;

    # Opcional: Aumente os timeouts se seus multipolígonos forem muito pesados
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://opensearch-cluster;
    }

    # Regra para o geoserver (Excluir depois)
    location ~ ^/([^/]+)/_mapping/properties$ {
        # Reescreve /index/_mapping/properties para /index/_mapping
        rewrite ^/([^/]+)/_mapping/properties$ /$1/_mapping break;
        proxy_pass http://opensearch-cluster;
    }
}
