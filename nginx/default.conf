client_max_body_size 1G;

upstream mapserver {
    server mapserver:8080;
}

upstream pygeoapi {
    server pygeoapi:8000;
}

upstream mapproxy {
    server mapproxy:8000;
}

server {
    listen       8080;
    server_name  _;

    # don't expose the nginx version in headers and error pages
    server_tokens off;

    # relative Location headers in nginx redirects, so they keep the public
    # host and port
    absolute_redirect off;

    # capabilities, GML, GeoJSON and the OGC API HTML compress well; images don't
    gzip on;
    gzip_types text/xml application/xml application/vnd.ogc.wms_xml application/vnd.ogc.se_xml
               application/vnd.ogc.gml application/json application/geo+json application/schema+json
               application/vnd.oai.openapi+json "application/vnd.oai.openapi+json;version=3.0"
               application/ld+json application/yaml text/css application/javascript text/plain;
    gzip_min_length 1024;

    #access_log  /var/log/nginx/host.access.log  main;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Pygeoapi
    location ~ ^/ogcapi(/|$) {
        include uwsgi_params;

        uwsgi_pass pygeoapi;
        uwsgi_param SCRIPT_NAME /ogcapi;

        uwsgi_param HTTP_X_FORWARDED_PROTOCOL $scheme;
        uwsgi_param HTTP_X_REAL_IP $remote_addr;

        # keep in sync with uWSGI's harakiri (60 s, conf/uwsgi.conf of the image)
        uwsgi_read_timeout 65s;

        # hold whole responses (e.g. large GeoJSON pages) in memory, so the uWSGI
        # worker is released as soon as possible
        uwsgi_buffer_size 16k;
        uwsgi_buffers 16 64k;
    }

    # Mapproxy
    location ~ ^/mapproxy(?<mapproxy_path>/.*)?$ {
        uwsgi_pass mapproxy;

        # after the include: the last PATH_INFO wins, and the image's uWSGI has
        # no mount to strip the prefix
        include uwsgi_params;
        uwsgi_param SCRIPT_NAME /mapproxy;
        uwsgi_param PATH_INFO $mapproxy_path;

        # keep in sync with uWSGI's harakiri (60 s, conf/uwsgi.conf of the image)
        uwsgi_read_timeout 65s;

        # hold whole responses (e.g. large GeoJSON pages) in memory, so the uWSGI
        # worker is released as soon as possible
        uwsgi_buffer_size 16k;
        uwsgi_buffers 16 64k;
    }

    # # Use nginx cache
    # location ~ "^/mapproxy/wmts/(?<layer>[A-Za-z0-9_-]+)/(?<grid>[A-Za-z0-9_-]+)/(?<z>[0-9]+)/(?<x>[0-9]+)/(?<y>[0-9]+)\.(?<ext>png|jpeg)$" {
    #     root /var/lib/mapproxy/cache;
    #     try_files /$layer/$grid/$z/$x/$y.$ext @mapproxy;

    #     # same header MapProxy sends for expires_hours: 24 in mapproxy.yaml
    #     # (disk hits only; MapProxy sets its own on the fallback)
    #     add_header Cache-Control "public, max-age=86400, s-maxage=86400";
    #     add_header X-Tile-Source disk;
    # }

    # location @mapproxy {
    #     uwsgi_pass mapproxy;
    #     add_header X-Tile-Source mapproxy;
    # }

    # Mapserver
    location ~ ^/mapserver(/|$) {
        # Bloqueia qualquer tentativa de passar ?map= ou &map= na URL (case-insensitive)
        # if ($args ~* "(^|&)map=") {
        #     return 403;
        # }

        fastcgi_split_path_info ^(/mapserver)(/.*)$;

        # fastcgi_param in a location drops the ones inherited from server, so
        # everything is set here
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass mapserver;

        # MapServer has no request timeout of its own: a GetMap on a slow source
        # holds a worker (4 by default) until it finishes
        fastcgi_read_timeout 60s;

        # hold whole responses (e.g. large GetMap images) in memory, so the
        # mapserv worker is released as soon as possible
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 64k;
    }
}

## OpenSearch
# Define the server pool
upstream opensearch-cluster {
    server opensearch-node1:9200;
    server opensearch-node2:9200;
}

server {
    listen       9200;
    server_name  _;

    # Desativa o buffer para respostas em tempo real (Streaming)
    proxy_buffering off;

    # Opcional: Aumente os timeouts se seus multipolígonos forem muito pesados
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://opensearch-cluster;
    }

    # Regra para o geoserver (Excluir depois)
    location ~ ^/([^/]+)/_mapping/properties$ {
        # Reescreve /index/_mapping/properties para /index/_mapping
        rewrite ^/([^/]+)/_mapping/properties$ /$1/_mapping break;
        proxy_pass http://opensearch-cluster;
    }
}
