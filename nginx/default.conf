client_max_body_size 1G;

# Ponto único /mapserver/ows: decide o destino pelo SERVICE. É uma lista de
# permissão porque o MapServer também desenha mapas fora do WMS: service=WFS&mode=map
# devolve um PNG. A primeira regra que casa decide
map $args $ows_destino {
    default bloqueado;
    # o MapServer decodifica nomes, e o nginx não: %73ervice=WMS escaparia das
    # regras abaixo
    "~(^|&)[^=&]*%" bloqueado;
    "~*(^|&)mode=" bloqueado;
    # o mapfile é fixado na própria rota
    "~*(^|&)map=" bloqueado;
    "~*(^|&)service=.*&service=" bloqueado;
    # o MapServer só usa wcs_formats para anunciar e entrega qualquer formato. Vale
    # só para GET: o POST em XML passa, porque o nginx não lê o corpo
    "~*^(?=(.*&)?service=wcs(&|$))(.*&)?format=(?!(geotiff|image/tiff|image%2ftiff)(&|$))" bloqueado;
    "~*(^|&)service=wms(&|$)" mapproxy;
    "~*(^|&)service=(wfs|wcs)(&|$)" mapserver;
}

# POST só em XML e sem query string, sempre para o MapServer: de XML ele só atende
# WFS e WCS, mas de um formulário entrega WMS e mapas, e o nginx não lê o corpo
map "$request_method $content_type|$args" $ows_post {
    default bloqueado;
    "~*^POST (text|application)/xml\s*(;[^|]*)?\|$" mapserver;
}

upstream mapserver {
    server mapserver:8080;
}

upstream pygeoapi {
    server pygeoapi:8000;
}

upstream mapproxy {
    server mapproxy:8000;
}

# HTTP só redireciona para HTTPS
server {
    listen       8080;
    server_name  _;

    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen       8443 ssl;
    http2        on;
    server_name  _;

    # nginx/certs fica fora do git; recarregue o nginx ao renovar o certificado
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # don't expose the nginx version in headers and error pages
    server_tokens off;

    # relative Location headers in nginx redirects, so they keep the public
    # host and port
    absolute_redirect off;

    # capabilities, GML, GeoJSON and the OGC API HTML compress well; images don't
    gzip on;
    gzip_types text/xml application/xml application/vnd.ogc.wms_xml application/vnd.ogc.se_xml
               application/vnd.ogc.gml application/json application/geo+json application/schema+json
               application/vnd.oai.openapi+json "application/vnd.oai.openapi+json;version=3.0"
               application/ld+json application/yaml text/css application/javascript text/plain;
    gzip_min_length 1024;

    #access_log  /var/log/nginx/host.access.log  main;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Pygeoapi
    location ~ ^/ogcapi(/|$) {
        include uwsgi_params;

        uwsgi_pass pygeoapi;
        uwsgi_param SCRIPT_NAME /ogcapi;

        uwsgi_param HTTP_X_FORWARDED_PROTOCOL $scheme;
        uwsgi_param HTTP_X_REAL_IP $remote_addr;

        # keep in sync with uWSGI's harakiri (60 s, conf/uwsgi.conf of the image)
        uwsgi_read_timeout 65s;

        # hold whole responses (e.g. large GeoJSON pages) in memory, so the uWSGI
        # worker is released as soon as possible
        uwsgi_buffer_size 16k;
        uwsgi_buffers 16 64k;
    }

    # Ponto único de serviço: WMS vai para o MapProxy, com cache, e WFS e WCS vão
    # para o MapServer. O WMS direto do MapServer fica na porta interna 8081
    location = /mapserver/ows {
        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 405;
        }

        set $ows_rota $ows_destino;
        if ($request_method = POST) {
            set $ows_rota $ows_post;
        }

        error_page 418 = @ows_wms;
        if ($ows_rota = mapproxy) {
            return 418;
        }
        if ($ows_rota != mapserver) {
            return 403;
        }

        set $args "map=DEFAULT&$args";

        include fastcgi_params;
        fastcgi_pass mapserver;

        # MapServer has no request timeout of its own: a GetMap on a slow source
        # holds a worker (4 by default) until it finishes
        fastcgi_read_timeout 60s;

        # hold whole responses in memory, so the mapserv worker is released as
        # soon as possible
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 64k;
    }

    location @ows_wms {
        uwsgi_pass mapproxy;

        # /ows é o despachante do MapProxy: com este SCRIPT_NAME, o GetCapabilities
        # anuncia /mapserver/ows. Depois do include: o último PATH_INFO vence
        include uwsgi_params;
        uwsgi_param SCRIPT_NAME /mapserver;
        uwsgi_param PATH_INFO /ows;

        # keep in sync with uWSGI's harakiri (60 s, conf/uwsgi.conf of the image)
        uwsgi_read_timeout 65s;

        # hold whole responses in memory, so the uWSGI worker is released as soon
        # as possible
        uwsgi_buffer_size 16k;
        uwsgi_buffers 16 64k;
    }
}

# Fonte WMS interna do MapProxy. A porta 8081 não é publicada no compose
server {
    listen       8081;
    server_name  _;

    server_tokens off;

    location ~ ^/mapserver(/|$) {
        fastcgi_split_path_info ^(/mapserver)(/.*)$;

        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass mapserver;

        # mesmos limites da rota externa
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 64k;
    }
}

## OpenSearch
# Define the server pool
upstream opensearch-cluster {
    server opensearch-node1:9200;
    server opensearch-node2:9200;
}

server {
    listen       9200;
    server_name  _;

    # Desativa o buffer para respostas em tempo real (Streaming)
    proxy_buffering off;

    # Opcional: Aumente os timeouts se seus multipolígonos forem muito pesados
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://opensearch-cluster;
    }

    # Regra para o geoserver (Excluir depois)
    location ~ ^/([^/]+)/_mapping/properties$ {
        # Reescreve /index/_mapping/properties para /index/_mapping
        rewrite ^/([^/]+)/_mapping/properties$ /$1/_mapping break;
        proxy_pass http://opensearch-cluster;
    }
}
