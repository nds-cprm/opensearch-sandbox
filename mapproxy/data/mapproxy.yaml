# -------------------------------
# MapProxy example configuration.
# -------------------------------
#
# This is a minimal MapProxy configuration.
# See full_example.yaml and the documentation for more options.
#

# Starts the following services:
# Demo:
#     http://localhost:8080/demo
# WMS:
#     capabilities: http://localhost:8080/service?REQUEST=GetCapabilities&SERVICE=WMS
# WMTS:
#     capabilities: http://localhost:8080/wmts/1.0.0/WMTSCapabilities.xml
#     first tile: http://localhost:8080/wmts/osm/webmercator/0/0/0.png
# Tile service (compatible with OSM/etc.)
#     first tile: http://localhost:8080/tiles/osm/webmercator/0/0/0.png
# TMS:
#     note: TMS is not compatible with OSM/Google Maps/etc.
#     first tile: http://localhost:8080/tms/1.0.0/osm/webmercator/0/0/0.png
# KML:
#     initial doc: http://localhost:8080/kml/osm/webmercator

services:
  demo:
  tms:
    use_grid_names: true
    # origin for /tiles service
    origin: 'nw'
  kml:
      use_grid_names: true
  wmts:
  wms:
    md:
      title: MapProxy WMS Proxy
      abstract: This is a minimal MapProxy example.
    srs: ['EPSG:3857', 'EPSG:4326', 'EPSG:4674']
    # o padrão inclui xml, que na 1.3.0 vira text/xml, recusado pelo MapServer
    featureinfo_types: [text, json]

layers:
  - name: litoestratigrafia
    title: Unidades Litoestratigráficas 1:1.000.000 (SGB)
    sources: [litoestratigrafia_cache]

caches:
  litoestratigrafia_cache:
    grids: [webmercator]
    sources: [sgb_wms]
    # served by nginx straight from disk: one grid per cache, tms layout
    # (<z>/<x>/<y>, the same as the WMTS URL) in <cache dir>/<layer>/<grid>
    cache:
      type: file
      directory_layout: tms
      directory: ${MAPPROXY_CACHE_DIR}/litoestratigrafia/webmercator

sources:
  sgb_wms:
    type: wms
    # repassa ao MapServer: este é o único WMS exposto aos clientes
    wms_opts:
      featureinfo: true
      legendgraphic: true
    req:
      url: "http://nginx:8081/mapserver?MAP=default&"
      layers: CONEXAO_OPENSEARCH
      # the layer only covers Brazil: keep the rest of the tiles transparent
      transparent: true

grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR

globals:
  cache:
    # tiles go to CouchDB; this directory only holds the tile locks
    base_dir: ${MAPPROXY_CACHE_DIR}
  tiles:
    # Cache-Control/Expires headers on tiles (browsers, CDNs, nginx cache)
    expires_hours: 24
