# -------------------------------
# MapProxy example configuration.
# -------------------------------
#
# This is a minimal MapProxy configuration.
# See full_example.yaml and the documentation for more options.
#

# Starts the following services:
# Demo:
#     http://localhost:8080/demo
# WMS:
#     capabilities: http://localhost:8080/service?REQUEST=GetCapabilities&SERVICE=WMS
# WMTS:
#     capabilities: http://localhost:8080/wmts/1.0.0/WMTSCapabilities.xml
#     first tile: http://localhost:8080/wmts/osm/webmercator/0/0/0.png
# Tile service (compatible with OSM/etc.)
#     first tile: http://localhost:8080/tiles/osm/webmercator/0/0/0.png
# TMS:
#     note: TMS is not compatible with OSM/Google Maps/etc.
#     first tile: http://localhost:8080/tms/1.0.0/osm/webmercator/0/0/0.png
# KML:
#     initial doc: http://localhost:8080/kml/osm/webmercator

services:
  demo:
  tms:
    use_grid_names: true
    # origin for /tiles service
    origin: 'nw'
  kml:
      use_grid_names: true
  wmts:
  wms:
    # só um idioma: o MapProxy não tem metadados por idioma. WMTS e TMS herdam este md
    md:
      title: Servidor de Mapas do SGB/CPRM
      abstract: Serviço de mapas para disponibilização de dados geológicos do Serviço Geológico do Brasil
      contact:
        person: Divisão de Geoprocessamento
        organization: Serviço Geológico do Brasil - SGB/CPRM
        address: Av Pasteur, 404, Urca
        city: Rio de Janeiro
        state: Rio de Janeiro
        postcode: '22290240'
        country: Brasil
      fees: none
      access_constraints: none
      keyword_list:
        - keywords: [geoespacial, dados, geologia, mapas]
    srs: ['EPSG:3857', 'EPSG:900913', 'EPSG:4326', 'EPSG:4674']
    # sem TIFF, que o padrão inclui: o MapProxy grava o EPSG em 16 bits e falha em EPSG:900913
    image_formats: ['image/png', 'image/jpeg', 'image/gif']
    # xml vira text/xml na 1.3.0 e application/vnd.ogc.gml nas outras; GML 3.1.1 só por pedido direto
    featureinfo_types: [text, xml, json]

layers:
  - name: litoestratigrafia
    title: Unidades Litoestratigráficas 1:1.000.000 (SGB)
    sources: [litoestratigrafia]

caches:
  litoestratigrafia:
    grids: [GLOBAL_WEBMERCATOR, GLOBAL_GEODETIC, GLOBAL_MERCATOR]
    sources: [sgb_wms]
    # <cache dir>/<cache>/<grade>, em layout tms (<z>/<x>/<y>). Sem cache.directory:
    # ele põe todas as grades no mesmo caminho, e os tiles se misturam
    cache:
      type: file
      directory_layout: tms
      use_grid_names: true

sources:
  sgb_wms:
    type: wms
    # repassa ao MapServer: este é o único WMS exposto aos clientes
    wms_opts:
      featureinfo: true
      legendgraphic: true
    req:
      url: "http://nginx:8081/geoserver?MAP=default&"
      layers: CONEXAO_OPENSEARCH
      # the layer only covers Brazil: keep the rest of the tiles transparent
      transparent: true

globals:
  cache:
    # tiles go to CouchDB; this directory only holds the tile locks
    base_dir: ${MAPPROXY_CACHE_DIR}
  tiles:
    # Cache-Control/Expires headers on tiles (browsers, CDNs, nginx cache)
    expires_hours: 24
